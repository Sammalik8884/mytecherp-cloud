<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTechERP — Modern Business Management</title>
    <meta name="description" content="MyTechERP — The modern, cloud-native ERP for field service companies. Manage customers, work orders, invoices, and your entire workforce in one platform." />
    <script>
      // Default to light mode for a clean, Google-style experience
      const saved = localStorage.getItem('mytecherp-theme');
      if (!saved || saved === 'system') {
        localStorage.setItem('mytecherp-theme', 'light');
      }
      const theme = localStorage.getItem('mytecherp-theme');
      document.documentElement.classList.remove('light', 'dark');
      document.documentElement.classList.add(theme || 'light');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
